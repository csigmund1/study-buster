[project]
name = "study-buster-backend"
version = "0.1.0"
description = "study-buster FastAPI backend"
requires-python = ">=3.12"
dependencies = [
    "anthropic>=0.120.2",
    "fastapi>=0.141.1",
    "genanki>=0.13.1",
    "ocrmac>=1.0.0; sys_platform == 'darwin'",
    "pillow>=11.0.0",
    "pymupdf>=1.28.0",
    "python-multipart>=0.0.32",
    "sqlmodel>=0.0.39",
    "uvicorn[standard]>=0.52.1",
]

[tool.uv]
package = false

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I"]

[tool.mypy]
python_version = "3.12"
files = ["app"]
disallow_untyped_defs = true
warn_unused_ignores = true
warn_redundant_casts = true
no_implicit_optional = true

[[tool.mypy.overrides]]
module = "genanki.*"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "ocrmac.*"
ignore_missing_imports = true

# pyobjc ships no stubs / py.typed marker; Vision is called through it directly
# in services/diagram_detection/ocr.py.
[[tool.mypy.overrides]]
module = "objc.*"
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = "Vision.*"
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "mypy>=2.3.0",
    "pytest>=9.1.1",
    "ruff>=0.16.1",
]
